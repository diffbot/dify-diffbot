identity:
  author: diffbot
  name: diffbot
  label:
    en_US: Diffbot
  description:
    en_US: Search the web, extract pages, ask Diffbot's LLM, run NLP, query the Diffbot Knowledge Graph (including raw DQL and its ontology), run crawls, and check account usage.
  icon: icon.png
  tags:
    - search
    - news
    - business
credentials_for_provider:
  diffbot_token:
    type: secret-input
    required: true
    label:
      en_US: Diffbot token
    placeholder:
      en_US: Paste the token from your Diffbot dashboard
    help:
      en_US: A free token is available at app.diffbot.com/get-started. Dify stores it as a secret and the plugin sends it only to Diffbot.
    url: https://app.diffbot.com/get-started
  request_timeout:
    type: text-input
    required: false
    default: "30"
    label:
      en_US: Request timeout (seconds)
    placeholder:
      en_US: "30"
    help:
      en_US: Seconds to wait for each Diffbot call, from 5 to 300. Leave blank for 30.
  api_base:
    type: text-input
    required: false
    label:
      en_US: API base URL (advanced)
    placeholder:
      en_US: https://api.diffbot.com
    help:
      en_US: "Advanced. Leave blank for https://api.diffbot.com. Must be https on a diffbot.com host, with no query string or credentials. Your token is sent to this host, so only use a Diffbot-operated host."
  kg_base:
    type: text-input
    required: false
    label:
      en_US: Knowledge Graph base URL (advanced)
    placeholder:
      en_US: https://kg.diffbot.com
    help:
      en_US: "Advanced. Leave blank for https://kg.diffbot.com. Must be https on a diffbot.com host, with no query string or credentials. Your token is sent to this host, so only use a Diffbot-operated host."
  llm_base:
    type: text-input
    required: false
    label:
      en_US: LLM and web search base URL (advanced)
    placeholder:
      en_US: https://llm.diffbot.com
    help:
      en_US: "Advanced. Leave blank for https://llm.diffbot.com. Must be https on a diffbot.com host, with no query string or credentials. Your token is sent to this host, so only use a Diffbot-operated host."
  nlp_base:
    type: text-input
    required: false
    label:
      en_US: Natural language base URL (advanced)
    placeholder:
      en_US: https://nl.diffbot.com
    help:
      en_US: "Advanced. Leave blank for https://nl.diffbot.com. Must be https on a diffbot.com host, with no query string or credentials. Your token is sent to this host, so only use a Diffbot-operated host."
tools:
  - tools/search_web.yaml
  - tools/extract.yaml
  - tools/search_organizations.yaml
  - tools/search_people.yaml
  - tools/search_news.yaml
  - tools/crawl_start.yaml
  - tools/crawl_jobs.yaml
  - tools/resolve_entities.yaml
  - tools/kg_query.yaml
  - tools/kg_ontology.yaml
  - tools/ask.yaml
  - tools/nlp.yaml
  - tools/account_usage.yaml
extra:
  python:
    source: provider/diffbot.py
