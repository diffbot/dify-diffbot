identity:
  name: account_usage
  author: diffbot
  label:
    en_US: Account usage
description:
  human:
    en_US: Show the plan, status, and recent daily usage of the Diffbot account behind the saved token. The token and account email are never returned.
  llm: >
    Read-only. Returns the Diffbot plan, account status, and daily usage counts (credits, extractions, and so on)
    for the saved token. Use it to check remaining capacity. It never returns the token or email.
parameters:
  - name: days
    type: number
    required: false
    form: form
    default: 7
    min: 1
    max: 366
    label:
      en_US: Days of usage
    human_description:
      en_US: How many recent days of usage to include (1 to 366).
    llm_description: How many recent days of usage to include, 1 to 366.
extra:
  python:
    source: tools/account_usage.py
