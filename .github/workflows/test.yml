name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: diffbot/requirements.txt
      - run: pip install -r diffbot/requirements.txt pytest
      # TODO(release): the plugin needs the `diffbot` SDK (3.2.0, then 3.3.0), which is not
      # published yet and cannot be installed from a private path or unpushed ref here.
      # Until then tests/conftest.py skips the SDK-dependent modules. After release, pin
      # `diffbot` in diffbot/requirements.txt (installed by the line above) and delete conftest.py.
      - run: pytest -q
